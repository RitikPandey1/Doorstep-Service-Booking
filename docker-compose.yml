services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://booking:booking@postgres:5432/booking?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    image: doorstep-booking:local
    command: ["seed"]
    environment:
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    image: doorstep-booking:local
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
